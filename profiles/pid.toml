# A profile: what the texts of one kind of drawing look like (docs/profiles.md). Patterns are Python regular
# expressions; a pattern under [vocabulary] matches a whole token (a word of a text).
format = 1
id = "pid"
name = "P&ID (piping and instrumentation diagram)"
drawing = "pid"

[evidence]  # recognising the kind of drawing from the texts read on it
titles = ['R&I', 'R\+I', 'P&ID']  # each counts TITLE
patterns = ['\bDN ?\d+']  # each match counts once
bubbles = true  # each circle with text in it (an instrument bubble) counts once

[vocabulary]
nominal_size = ['DN\d{1,4}', 'PN\d{1,3}']
line_number = ['DN\d{1,4}-[A-Z]{1,4}-\d{3,6}']  # nominal size, medium, number: DN80-P-1011
# equipment such as P-101 or B-501; not with I or O, as the vocabulary would read "1-101" or "0-100" as such a tag
equipment = ['[A-HJ-NP-Z]{1,2}-\d{3,5}[A-Z]?']

[reading]
framed = "any"  # letters (an actuator's M, an interlock's I) and digits (note hexagons, revision triangles) alike

[steps]  # steps of the recognition switched off on this kind (a job's options.on switches one on again)
off = ["dimensions"]  # a P&ID has no dimension chains: a line number between two flanges is no dimension
