apiVersion: v1
kind: Service
metadata:
  name: {{ include "cad-ingest.fullname" . }}
  labels:
    {{- include "cad-ingest.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    {{- include "cad-ingest.selectorLabels" (dict "context" . "component" "api") | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      name: http
