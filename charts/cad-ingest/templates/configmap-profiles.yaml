{{- with .Values.worker.profiles }}
{{- range $file, $content := . }}
{{- /* cad-ingest reads only *.toml; the name becomes a file name, so it holds no path */}}
{{- if not (regexMatch "^[A-Za-z0-9_-][A-Za-z0-9._-]*[.]toml$" $file) }}
{{- fail (printf "worker.profiles: %s must be a file name ending in .toml (letters, digits, '.', '_', '-'; not starting with '.')" $file) }}
{{- end }}
{{- if not (kindIs "string" $content) }}
{{- fail (printf "worker.profiles: %s must be TOML text as a string, for example a block after |" $file) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cad-ingest.fullname" $ }}-profiles
  labels:
    {{- include "cad-ingest.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
