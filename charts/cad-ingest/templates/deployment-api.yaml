apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cad-ingest.fullname" . }}
  labels:
    {{- include "cad-ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cad-ingest.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cad-ingest.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "cad-ingest.podSpec" (dict "context" . "component" "api") | trim | nindent 6 }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          {{- if not .labelSelector }}
          labelSelector:
            matchLabels:
              {{- include "cad-ingest.selectorLabels" (dict "context" $ "component" "api") | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "cad-ingest.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "cad-ingest.commonEnv" . | nindent 12 }}
            - name: MAX_QUEUED_JOBS
              value: {{ .Values.api.maxQueuedJobs | int64 | quote }}
            {{- with .Values.apiToken.existingSecret }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.apiToken.secretKey }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
